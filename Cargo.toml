[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/moulindavid/cornu"
rust-version = "1.85"

[workspace.dependencies]
cornu-core = { path = "crates/cornu-core" }
eframe = "0.37"
reqwest = { version = "0.13", features = ["gzip", "brotli", "deflate", "zstd", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "1"
url = "2"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
