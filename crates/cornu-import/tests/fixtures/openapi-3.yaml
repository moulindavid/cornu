openapi: 3.0.3
info:
  title: Swagger Petstore - OpenAPI 3.0
  version: 1.0.27
servers:
  - url: "https://{region}.petstore.example/api/v3"
    variables:
      region:
        default: eu
        enum: [eu, us]
tags:
  - name: pet
    description: Everything about your Pets
  - name: store
  - name: empty
security:
  - bearerAuth: []
paths:
  /pet:
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        $ref: "#/components/requestBodies/Pet"
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            default: available
            enum: [available, pending, sold]
        - name: limit
          in: query
          schema:
            type: integer
        - name: session
          in: cookie
          schema:
            type: string
  /pet/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [pet]
      operationId: getPetById
      parameters:
        - name: X-Request-Id
          in: header
          example: req-1
        - name: Accept
          in: header
          schema:
            type: string
    delete:
      tags: [pet]
      summary: Deletes a pet
      security:
        - api_key: []
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: uploads an image
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                additionalMetadata:
                  type: string
                file:
                  type: string
                  format: binary
  /store/order:
    post:
      tags: [store]
      summary: Place an order for a pet
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Order"
          application/xml:
            schema:
              $ref: "#/components/schemas/Order"
  /health:
    get:
      summary: Health check
      security: []
      responses:
        200:
          description: ok
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBodies:
    Pet:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Pet"
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Dogs }
    Pet:
      required: [name, photoUrls]
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        name: { type: string, example: doggie }
        category:
          $ref: "#/components/schemas/Category"
        photoUrls:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [available, pending, sold]
        parent:
          $ref: "#/components/schemas/Pet"
    Order:
      type: object
      properties:
        petId: { type: integer, example: 198772 }
        quantity: { type: integer, example: 7 }
        shipDate: { type: string, format: date-time }
        complete: { type: boolean }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    api_key:
      type: apiKey
      name: api_key
      in: header
